      type: object
      properties: {skill: {type: "string"}}
      required: ["skill"]
    output_schema: {}
  - name: get_runtime_info
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {}
      required: []
    output_schema: {}
auth:
  required_env: []
dependencies: []
