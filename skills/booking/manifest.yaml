schema_version: "1"
name: booking
version: "1.0.0"
title: "Booking"
description: "Primary entry point for direct flight, hotel, restaurant, or event-ticket transactions and for bounded live availability checks delegated by Travel Planning. Always use before provider-specific skills or browser work when the user asks to find live availability or prices, compare bookable options, book, or continue an active booking. Do not use for trip planning itself, broad inspiration, opening hours, schedules, flight status, or other factual questions without transaction intent."
kind: skill
lifecycle: stable
actions:
  - name: hotel_search_link
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {destination: {type: "string"}, checkin: {type: "string"}, checkout: {type: "string"}, adults: {type: "integer", default: 2}}
      required: ["destination"]
    output_schema: {}
  - name: restaurant_search_link
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {restaurant: {type: "string"}, covers: {type: "integer", default: 2}, datetime: {type: "string", description: "ISO8601"}}
      required: []
    output_schema: {}
  - name: search_events
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {keyword: {type: "string"}, city: {type: "string"}, limit: {type: "integer", default: 10}}
      required: []
    output_schema: {}
  - name: search_flights
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {origin: {type: "string"}, destination: {type: "string"}, departure_date: {type: "string"}, limit: {type: "integer", default: 5}}
      required: ["origin", "destination", "departure_date"]
    output_schema: {}
auth:
  required_env: []
dependencies: []
