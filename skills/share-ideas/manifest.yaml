schema_version: "1"
name: share-ideas
version: "1.0.0"
title: "Share ideas"
description: "Publish a portable Idea card from the Ideas tab — only after the user explicitly asks to publish it."
kind: skill
lifecycle: stable
actions:
  - name: publish_idea
    type: write
    risk: write
    approval: required
    idempotent: true
    input_schema:
      type: object
      properties: {title: {type: "string"}, pitch: {type: "string"}, steps: {type: "array", items: {type: "string"}}}
      required: ["title"]
    output_schema: {}
auth:
  required_env: []
dependencies: []
