schema_version: "1"
name: wide-research
version: "1.0.0"
title: "Wide Research"
description: "Use when the user needs broad parallel research across many independent inputs with a shared output schema."
kind: skill
lifecycle: stable
actions:
  - name: research
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {question: {type: "string"}, queries: {type: "array", items: {type: "string"}, description: "Up to 5 focused sub-queries (defaults to [question])"}, results_per_query: {type: "integer", default: 5, maximum: 10}}
      required: ["question"]
    output_schema: {}
auth:
  required_env: ["SERPER_API_KEY"]
dependencies: []
