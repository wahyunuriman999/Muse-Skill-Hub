schema_version: "1"
name: duffel
version: "1.0.0"
title: "Duffel"
description: "Use Duffel to search, book, pay for, or manage flights. Use Duffel to monitor an already booked flight's fare when the user directly asks for ongoing price monitoring."
kind: skill
lifecycle: stable
actions:
  - name: create_order
    type: write
    risk: financial
    approval: required
    idempotent: true
    input_schema:
      type: object
      properties: {offer_id: {type: "string"}, currency: {type: "string"}, amount: {type: "string"}, passenger: {type: "object", description: "Duffel passenger object (given_name, family_name, ...)"}}
      required: ["offer_id", "currency", "amount"]
    output_schema: {}
  - name: search_offers
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {origin: {type: "string", description: "e.g. CGK"}, destination: {type: "string", description: "e.g. SIN"}, departure_date: {type: "string", description: "YYYY-MM-DD"}, passenger_age: {type: "integer", default: 30}, max_connections: {type: "integer", default: 1}, limit: {type: "integer", default: 5, maximum: 20}}
      required: ["origin", "destination", "departure_date"]
    output_schema: {}
auth:
  required_env: ["DUFFEL_ACCESS_TOKEN"]
dependencies: []
