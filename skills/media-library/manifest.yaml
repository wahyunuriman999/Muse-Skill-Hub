schema_version: "1"
name: media-library
version: "1.0.0"
title: "Media Library"
description: "Search and inspect the user's photo library, including connected device galleries. Use for photo requests and whenever a photo could ground or personalize a response; lookups of uploaded photos are cheap, so check opportunistically and move on if nothing fits."
kind: skill
lifecycle: stable
actions:
  - name: list_photos
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {limit: {type: "integer", default: 20, maximum: 200}}
      required: []
    output_schema: {}
  - name: search_photos
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {query: {type: "string"}, limit: {type: "integer", default: 20, maximum: 200}}
      required: ["query"]
    output_schema: {}
auth:
  required_env: []
dependencies: []
