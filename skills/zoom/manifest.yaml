schema_version: "1"
name: zoom
version: "1.0.0"
title: "Zoom"
description: "Manage Zoom: schedule and list meetings, fetch recordings, and manage meeting settings."
kind: skill
lifecycle: stable
actions:
  - name: create_meeting
    type: write
    risk: write
    approval: required
    idempotent: true
    input_schema:
      type: object
      properties: {topic: {type: "string"}, start_time: {type: "string", description: "ISO-8601, e.g. 2026-10-02T10:00:00"}, duration_min: {type: "integer", default: 60}}
      required: ["topic"]
    output_schema: {}
  - name: list_meetings
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {}
      required: []
    output_schema: {}
auth:
  required_env: ["ZOOM_CLIENT_ID", "ZOOM_CLIENT_SECRET", "ZOOM_ACCOUNT_ID"]
dependencies: []
