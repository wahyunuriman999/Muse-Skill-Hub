schema_version: "1"
name: philips-hue
version: "1.0.0"
title: "Philips Hue"
description: "Control Philips Hue smart lights, rooms, scenes, and devices via the Hue Remote API v2."
kind: skill
lifecycle: stable
actions:
  - name: list_lights
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {}
      required: []
    output_schema: {}
  - name: set_light
    type: write
    risk: device
    approval: required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {light_id: {type: "string"}, on: {type: "boolean"}, brightness: {type: "integer", minimum: 1, maximum: 254}}
      required: ["light_id"]
    output_schema: {}
auth:
  required_env: ["HUE_BRIDGE_IP", "HUE_USERNAME"]
dependencies: []
