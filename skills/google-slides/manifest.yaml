schema_version: "1"
name: google-slides
version: "1.0.0"
title: "Google Slides"
description: "Read, create, and edit the user's Google Slides presentations."
kind: skill
lifecycle: stable
actions:
  - name: create_presentation
    type: write
    risk: write
    approval: required
    idempotent: true
    input_schema:
      type: object
      properties: {title: {type: "string"}}
      required: ["title"]
    output_schema: {}
  - name: get_presentation
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {presentation_id: {type: "string", description: "ID from its URL"}}
      required: ["presentation_id"]
    output_schema: {}
auth:
  required_env: ["GOOGLE_OAUTH_TOKEN"]
dependencies: []
