schema_version: "1"
name: wallet
version: "1.0.0"
title: "Wallet"
description: "Coordinate payments: check wallet connection state, use saved payment methods and addresses through secure provider pages, and run the required purchase review and approval flow."
kind: skill
lifecycle: stable
actions:
  - name: add_payment_method
    type: write
    risk: financial
    approval: required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {label: {type: "string", description: "e.g. 'BCA debit'"}, brand: {type: "string"}, last4: {type: "string"}}
      required: ["label"]
    output_schema: {}
  - name: connect
    type: write
    risk: write
    approval: required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {provider: {type: "string", default: "manual"}}
      required: []
    output_schema: {}
  - name: get_state
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {}
      required: []
    output_schema: {}
  - name: list_payment_methods
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {}
      required: []
    output_schema: {}
auth:
  required_env: []
dependencies: []
