schema_version: "1"
name: google-docs
version: "1.0.0"
title: "Google Docs"
description: "Read, create, and edit the user's Google Docs."
kind: skill
lifecycle: stable
actions:
  - name: create_document
    type: write
    risk: write
    approval: required
    idempotent: true
    input_schema:
      type: object
      properties: {title: {type: "string"}, text: {type: "string"}}
      required: ["title"]
    output_schema: {}
  - name: get_document
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {document_id: {type: "string"}}
      required: ["document_id"]
    output_schema: {}
auth:
  required_env: ["GOOGLE_OAUTH_TOKEN"]
dependencies: []
