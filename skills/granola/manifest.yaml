schema_version: "1"
name: granola
version: "1.1.0"
title: "Granola"
description: "Search and read Granola meeting notes and transcripts through Granola's official public API (public-api.granola.ai). Requires a Granola API key (GRANOLA_API_KEY)."
kind: skill
lifecycle: stable
actions:
  - name: get_note
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {note_id: {type: "string"}, include_transcript: {type: "boolean", default: true}}
      required: ["note_id"]
    output_schema: {}
  - name: list_notes
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {created_after: {type: "string", description: "YYYY-MM-DD"}, created_before: {type: "string", description: "YYYY-MM-DD"}, updated_after: {type: "string", description: "YYYY-MM-DD"}, folder_id: {type: "string"}, cursor: {type: "string", description: "Pagination cursor from a previous call"}, page_size: {type: "integer", default: 10, minimum: 1, maximum: 30}}
      required: []
    output_schema: {}
  - name: search_notes
    type: read
    risk: read
    approval: not_required
    idempotent: true
    input_schema:
      type: object
      properties: {query: {type: "string"}, limit: {type: "integer", default: 10, maximum: 30}}
      required: ["query"]
    output_schema: {}
auth:
  required_env: ["GRANOLA_API_KEY"]
dependencies: []
