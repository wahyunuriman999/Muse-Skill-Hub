schema_version: "1"
name: outlook-calendar
version: "1.0.0"
title: "Outlook Calendar"
description: "View, create, update, and delete events in the user's Outlook Calendar."
kind: skill
lifecycle: stable
actions:
  - name: create_event
    type: write
    risk: write
    approval: required
    supports_idempotency_key: true
    required_scopes: ["Calendars.ReadWrite"]
    input_schema:
      type: object
      properties: {subject: {type: "string"}, start: {type: "string"}, end: {type: "string"}, timezone: {type: "string", default: "UTC"}, body: {type: "string"}}
      required: ["subject", "start", "end"]
    output_schema: {}
  - name: delete_event
    type: write
    risk: destructive
    approval: required
    supports_idempotency_key: true
    required_scopes: ["Calendars.ReadWrite"]
    input_schema:
      type: object
      properties: {event_id: {type: "string"}}
      required: ["event_id"]
    output_schema: {}
  - name: list_events
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: ["Calendars.Read"]
    input_schema:
      type: object
      properties: {start: {type: "string", description: "ISO8601 lower bound filter"}, limit: {type: "integer", default: 20, maximum: 100}}
      required: []
    output_schema: {}
auth:
  required_env: ["MICROSOFT_ACCESS_TOKEN"]
dependencies: []
