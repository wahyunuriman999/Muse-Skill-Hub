schema_version: "1"
name: magic-moment
version: "1.1.0"
title: "Magic Moment"
description: "Turn talking-head video footage into shareable short clips. The hosted AI-highlight feature has no public API, so this skill ships an honest local ffmpeg implementation: cut clips, burn in SRT captions, reframe to vertical 9:16."
kind: skill
lifecycle: stable
actions:
  - name: cut_clip
    type: write
    risk: write
    approval: required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {input_path: {type: "string"}, output_path: {type: "string"}, start: {type: "string", description: "Start time, seconds or HH:MM:SS", default: "0"}, end: {type: "string", description: "End time (exclusive with duration)"}, duration: {type: "string", description: "Clip length in seconds (exclusive with end)"}, srt_path: {type: "string", description: "Optional SRT subtitle file to burn in"}, vertical: {type: "boolean", default: false, description: "Center-crop to 9:16 vertical"}, scale_width: {type: "integer", description: "Optional output width px (height auto)"}}
      required: ["input_path", "output_path"]
    output_schema: {}
  - name: extract_thumbnail
    type: write
    risk: write
    approval: required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {input_path: {type: "string"}, output_path: {type: "string"}, at: {type: "string", description: "Timestamp, seconds or HH:MM:SS", default: "1"}}
      required: ["input_path", "output_path"]
    output_schema: {}
  - name: probe
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {input_path: {type: "string"}}
      required: ["input_path"]
    output_schema: {}
auth:
  required_env: []
dependencies: []
