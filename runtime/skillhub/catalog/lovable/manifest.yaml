schema_version: "1"
name: lovable
version: "1.2.0"
title: "Lovable"
description: "Lovable AI app builder. Executable driver for the official Lovable REST API (api.lovable.dev/v1): list workspaces/projects, publish, update, and message projects. Requires a Business/Enterprise plan API key."
kind: skill
lifecycle: stable
actions:
  - name: get_project
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {project_id: {type: "string"}}
      required: ["project_id"]
    output_schema: {}
  - name: list_projects
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {workspace_id: {type: "string"}, limit: {type: "integer", default: 50, minimum: 1, maximum: 100}, cursor: {type: "string", description: "Pagination cursor from a previous call"}}
      required: ["workspace_id"]
    output_schema: {}
  - name: list_workspaces
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {}
      required: []
    output_schema: {}
  - name: publish_project
    type: write
    risk: write
    approval: required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {project_id: {type: "string"}, config: {type: "object", description: "Optional deployment config"}}
      required: ["project_id"]
    output_schema: {}
  - name: send_project_message
    type: write
    risk: write
    approval: required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {project_id: {type: "string"}, message: {type: "string"}}
      required: ["project_id", "message"]
    output_schema: {}
  - name: update_project
    type: write
    risk: write
    approval: required
    supports_idempotency_key: true
    required_scopes: []
    input_schema:
      type: object
      properties: {project_id: {type: "string"}, visibility: {type: "string", description: "e.g. private, workspace_view, public", enum: ["private", "workspace_view", "public"]}, name: {type: "string"}}
      required: ["project_id"]
    output_schema: {}
auth:
  required_env: ["LOVABLE_API_KEY"]
dependencies: []
