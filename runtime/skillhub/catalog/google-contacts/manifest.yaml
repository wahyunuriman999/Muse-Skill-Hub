schema_version: "1"
name: google-contacts
version: "1.0.0"
title: "Google Contacts"
description: "Search, view, create, update, and delete the user's Google Contacts."
kind: skill
lifecycle: stable
actions:
  - name: create_contact
    type: write
    risk: write
    approval: required
    supports_idempotency_key: true
    required_scopes: ["https://www.googleapis.com/auth/contacts"]
    input_schema:
      type: object
      properties: {given_name: {type: "string"}, family_name: {type: "string"}, email: {type: "string"}}
      required: []
    output_schema: {}
  - name: list_contacts
    type: read
    risk: read
    approval: not_required
    supports_idempotency_key: true
    required_scopes: ["https://www.googleapis.com/auth/contacts.readonly"]
    input_schema:
      type: object
      properties: {limit: {type: "integer", default: 50, maximum: 200}}
      required: []
    output_schema: {}
auth:
  required_env: ["GOOGLE_OAUTH_TOKEN"]
dependencies: []
