[project]
name = "muse-skill-hub-runtime"
version = "2.3.0"
description = "LLM-agnostic capability runtime for AI agents: universal skills as executable, permission-enforced MCP tools"
authors = [{ name = "Wahyu Nur Iman" }]
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=41",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.0", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
skillhub-server = "skillhub.server:main"
skillhub = "skillhub.cli:main"
muse-skill-hub-runtime = "skillhub.server:main"

[tool.setuptools.package-data]
skillhub = ["catalog/*/SKILL.md", "catalog/*/manifest.yaml",
            "catalog/*/README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
