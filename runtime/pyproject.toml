[project]
name = "muse-skill-hub-runtime"
version = "1.1.0"
description = "Executable MCP runtime for Muse Skill Hub — 87 skills as real, callable tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
skillhub-server = "skillhub.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
