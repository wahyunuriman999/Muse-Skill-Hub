[project]
name = "muse-skill-hub-runtime"
version = "2.2.0"
description = "LLM-agnostic capability runtime for AI agents: universal skills as executable, permission-enforced MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=41",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
skillhub-server = "skillhub.server:main"
skillhub = "skillhub.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
